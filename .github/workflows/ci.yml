name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_SITE_TITLE: Blog
      NEXT_PUBLIC_SITE_DESCRIPTION: CI build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Smoke test production routes
        run: pnpm test:smoke
      - name: Build container image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_SITE_URL=https://gujiakai.top
          --build-arg "NEXT_PUBLIC_SITE_TITLE=周见"
          --build-arg "NEXT_PUBLIC_SITE_DESCRIPTION=专注于分享互联网上有趣的东西。"
          --tag next-blog:ci .
